<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onovich Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h1 class="logo">Onovich<br><span>Admin</span></h1>
      <nav id="sectionNav">
        <div class="nav-label">内容分区</div>
        <!-- injected by JS -->
      </nav>
      <div class="sidebar-actions">
        <button id="btnPreview" class="btn btn--secondary">预览站点</button>
      </div>
    </aside>

    <!-- Main editor -->
    <main class="editor">
      <div class="editor-header">
        <h2 id="editorTitle">— 选择分区 —</h2>
        <div class="editor-header-actions">
          <button id="btnAddItem" class="btn btn--ghost" disabled>+ 新增条目</button>
          <button id="btnImportImg" class="btn btn--ghost" disabled>导入图片</button>
        </div>
      </div>

      <div id="itemList" class="item-list">
        <!-- items rendered here -->
      </div>

      <!-- Item editor panel -->
      <div id="itemEditor" class="item-editor hidden">
        <div class="item-editor__inner">
          <div class="item-editor__form" id="itemForm"></div>
          <div class="item-editor__footer">
            <button id="btnSaveItem" class="btn btn--primary">保存条目</button>
            <button id="btnCancelItem" class="btn btn--ghost">取消</button>
            <button id="btnDeleteItem" class="btn btn--danger">删除</button>
          </div>
        </div>
      </div>

      <!-- Publish bar -->
      <div class="publish-bar">
        <input id="commitMsg" class="publish-input" type="text" placeholder="发布备注（可选）" />
        <button id="btnPublish" class="btn btn--primary">一键发布</button>
        <span id="publishStatus" class="publish-status"></span>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
